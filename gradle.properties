#AndroidCS: enforce UTF-8 & locale for Gradle daemon
#Tue Nov 24 03:52:53 GMT 2026
org.gradle.caching=true
android.nonTransitiveRClass=true
android.builtInKotlin=false
org.gradle.daemon.idletimeout=10800000
